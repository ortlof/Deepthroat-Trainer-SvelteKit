; Feature selection for the trainer build. 1 = compiled in, 0 = left out.
; Each disabled feature saves flash and a couple of HTTP endpoints. The board
; has 16 MB of flash, so the features this device really uses are switched on.
[features]
build_flags = 
  -D FT_SECURITY=1             ; REST and WebSocket sit behind a login
  -D FT_MQTT=0                 ; 1: drive the trainer from Home Assistant (needs the cert bundle)
  -D FT_NTP=1                  ; clock for the session timestamps
  -D FT_UPLOAD_FIRMWARE=1      ; update from the browser and over
                               ; POST /rest/uploadFirmware (scripts/ota-upload.py)
  -D FT_DOWNLOAD_FIRMWARE=0    ; needs a release server and the SSL root store
  -D FT_SLEEP=0                ; the trainer dims its own backlight instead
  -D FT_BATTERY=0              ; this project reads the battery itself
  -D FT_ANALYTICS=0            ; no analytics charts in the UI, saves flash
  -D FT_COREDUMP=1             ; a panic leaves a backtrace that /rest/coreDump serves,
                               ; and the partition table has the coredump partition
;  -D FT_ETHERNET=1            ; only for boards with a W5500/LAN8720 PHY
