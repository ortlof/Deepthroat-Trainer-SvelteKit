; ============================================================================
;  DTT-Trainer  --  deepthroat trainer on ESP32-SvelteKit
;
;  Board:  LilyGo T-RGB 2.1 inch round display (ESP32-S3R8, 16 MB flash,
;          8 MB OPI PSRAM, ST7701S 480x480 RGB panel, CST820 touch)
;  Sensor: VL6180X / VL6180 time-of-flight distance sensor on the shared I2C bus
;  Backend: ESP32-sveltekit (REST + WebSocket events + embedded SvelteKit UI)
;
;  First flash: ESP Web Tools in a browser with
;  build/merged/DTT-Trainer_<env>_<version>_webflash.bin, then the device comes
;  up as an access point "DTT-Trainer-<id>" at http://192.168.4.1. Set the WiFi
;  credentials there and reach the device at its station address afterwards.
; ============================================================================

[platformio]
description = Deepthroat trainer on the LilyGo T-RGB round display (ESP32-SvelteKit)
data_dir = data
extra_configs =
	factory_settings.ini
	features.ini
default_envs = t-rgb
; The T-RGB board definition (16 MB flash, OPI PSRAM) ships with this project.
boards_dir = boards

[env]
framework = arduino
; pioarduino fork: Arduino core 3.x / ESP-IDF 5.5. Required by ESP32-SvelteKit.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.32/platform-espressif32.zip
build_flags =
	${factory_settings.build_flags}
	${features.build_flags}
	-D BUILD_TARGET=\"$PIOENV\"
	-D APP_NAME=\"DTT-Trainer\"         ; only [a-zA-Z0-9-_], it becomes a filename
	-D APP_VERSION=\"0.27.0\"            ; semver, used by the OTA name scheme

	; Networking on core 0, display / sensor / session logic stay on core 1
	-D ESP32SVELTEKIT_RUNNING_CORE=0

	; The front end is embedded in the firmware binary, so one .bin carries the
	; whole device (single file for the web flasher and for an OTA update).
	-D EMBED_WWW

	; The embedded asset names carry no content hash, so never let a browser
	; keep the UI for a year: an update would stay invisible until a hard reload.
	-D WWW_NO_CACHE

	-D SERIAL_INFO
	-D CORE_DEBUG_LEVEL=3

lib_compat_mode = strict
monitor_speed = 115200
monitor_filters =
	esp32_exception_decoder
	log2file
board_build.filesystem = littlefs

; FT_MQTT=1 and FT_DOWNLOAD_FIRMWARE=1 both need the embedded certificate
; bundle; leave these two lines in place when either feature is switched on,
; otherwise the link step fails with an undefined reference to
; _binary_src_certs_x509_crt_bundle_bin_start.
board_build.embed_files = src/certs/x509_crt_bundle.bin
board_ssl_cert_source = adafruit

extra_scripts =
	pre:scripts/build_interface.py
	pre:scripts/generate_cert_bundle.py
	scripts/merge_bin.py
	scripts/rename_fw.py
	scripts/save_elf.py

lib_deps =
	ArduinoJson@>=7.0.0
	; The framework includes MqttSettingsService.h from ESP32SvelteKit.h whether or
	; not FT_MQTT is set, so this client must be present even with MQTT off.
	elims/PsychicMqttClient@^0.2.4
	; Drawing on the ST7701S panel over the RGB bus
	moononournation/GFX Library for Arduino@^1.5.0
	; VL6180X / VL6180 time-of-flight sensor
	adafruit/Adafruit_VL6180X@^1.4.4
	adafruit/Adafruit BusIO@^1.17.0

; ---------------------------------------------------------------------------
;  LilyGo T-RGB 2.1 inch, full circle
;
;  16 MB flash, 8 MB OPI PSRAM. The RGB panel needs its framebuffer in PSRAM and
;  its init runs as 3-wire SPI through the XL9535 I2C expander; both are set up
;  by the board definition and src/TrainerDisplay.cpp.
;
;  default_16MB.csv: two 3.3 MB application slots (enough for the framework, the
;  embedded front end and the board support) and a large LittleFS.
; ---------------------------------------------------------------------------
[env:t-rgb]
board = lilygo-t-rgb
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
; The board definition says qio, and the pioarduino builder deliberately turns
; that into a DIO image (_get_board_flash_mode in the platform's main.py). That
; is left alone on purpose: a DIO image boots on every T-RGB revision, at a
; slightly lower flash bandwidth.
upload_speed = 921600
build_flags =
	${env.build_flags}
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

; ---------------------------------------------------------------------------
;  The debugging environment: the same firmware with the login switched off.
;
;  FT_SECURITY=1 is what puts the REST endpoints and the WebSocket behind the
;  password form. This environment undefines it and sets it to 0, so the web
;  interface opens without a login and can be debugged properly (layout,
;  responsive behaviour, console errors) instead of being inspected through a
;  login wall.
;
;  This is a debugging image. Anything that can reach the device can drive the
;  trainer while it runs, so flash the normal environment again afterwards:
;
;      pio run -e t-rgb-preview     ; build the open image
;      pio run -e t-rgb             ; build the normal one again
;
[env:t-rgb-preview]
extends = env:t-rgb
build_flags =
	${env:t-rgb.build_flags}
	; listed last on purpose: a later -D wins, so this switches the login off
	-D FT_SECURITY=0

;
;  There is no espota and no ArduinoOTA in this firmware, so
;  `upload_protocol = espota` and `pio run -t upload --upload-port <ip>` do NOT
;  work. With FT_UPLOAD_FIRMWARE=1 the device updates itself, the same path the
;  browser uses on System -> Update:
;
;      POST /rest/uploadFirmware   multipart, field "file", JWT required
;
;  Progress arrives on the WebSocket event "otastatus". Use the helper:
;
;      scripts/ota-upload.py --device <ip> build/release/<image>.bin
;
;  The image must fit the free application slot, otherwise UploadFirmwareService
;  rejects it. See build/release/ for the images this build produces.
; ---------------------------------------------------------------------------
